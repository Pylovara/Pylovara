<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pylovara MCS Gatter-Show | Premium</title>
    <style>
        :root {
            --bg-color: #03080c;
            --main-green: #00ff41;
            --main-blue: #00d2ff;
            --main-yellow: #ffea00;
            --main-red: #ff3c3c;
            --main-white: #e0f2f1;
            --glass-bg: rgba(5, 15, 25, 0.85);
            --neon-glow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-green);
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #matrix-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
            filter: blur(1px);
        }

        .ui-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 255, 65, 0.5);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 65, 0.1);
            width: 85%;
            max-width: 900px;
            text-align: center;
            position: relative;
            animation: panelEntrance 1s ease-out;
        }

        @keyframes panelEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-container {
            border-bottom: 2px solid var(--main-green);
            margin-bottom: 30px;
            padding-bottom: 15px;
            position: relative;
        }

        h1 {
            color: var(--main-white);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin: 0;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(224, 242, 241, 0.5);
        }

        h1::after {
            content: " v2.0-ULTRA";
            font-size: 0.8rem;
            color: var(--main-yellow);
            letter-spacing: normal;
        }

        #status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--main-blue);
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
        }

        #code-display {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 25px;
            margin: 20px 0;
            text-align: left;
            min-height: 160px;
            border-left: 4px solid var(--main-yellow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .code-line {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .bsk-chain-container {
            margin-top: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(0, 210, 255, 0.15);
            position: relative;
            display: none;
            word-break: break-all;
            border: 1px solid rgba(0, 210, 255, 0.1);
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.05);
        }

        .bsk-chain-fill {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            color: var(--main-green);
            word-break: break-all;
            pointer-events: none;
            text-shadow: 0 0 12px var(--main-green);
            clip-path: inset(0 100% 0 0);
            /* Gestartet bei 0% sichtbarkeit */
            transition: none;
        }

        .symbol {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active {
            color: white !important;
            transform: scale(1.2);
            text-shadow: 0 0 20px currentColor;
            filter: brightness(1.5);
        }

        .percentage-counter {
            font-family: 'Courier New', Courier, monospace;
            color: var(--main-yellow);
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            text-shadow: 0 0 15px rgba(255, 234, 0, 0.5);
            text-align: right;
        }

        .gate-grid {
            display: grid;
            grid-template-columns: repeat(25, 1fr);
            gap: 4px;
            margin-top: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
        }

        .gate {
            width: 100%;
            padding-bottom: 100%;
            border: 1px solid rgba(0, 255, 65, 0.05);
            background: rgba(0, 255, 65, 0.01);
            transition: all 0.4s;
        }

        .pulse {
            background: var(--main-green) !important;
            box-shadow: 0 0 12px var(--main-green);
        }

        .alu {
            background: var(--main-red) !important;
            box-shadow: 0 0 12px var(--main-red);
        }

        .id {
            background: var(--main-yellow) !important;
            box-shadow: 0 0 12px var(--main-yellow);
        }

        #controls {
            margin-top: 30px;
        }

        button {
            background: transparent;
            border: 2px solid var(--main-green);
            color: var(--main-green);
            padding: 12px 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            box-shadow: var(--neon-glow);
        }

        button:hover {
            background: var(--main-green);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--main-green);
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: "MCS Gatter-Show";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            clip: rect(0, 0, 0, 0);
        }

        .glitch:hover::before {
            left: 2px;
            text-shadow: -2px 0 var(--main-red);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
    </style>
</head>

<body>
    <canvas id="matrix-container"></canvas>

    <div class="ui-panel">
        <div id="status-bar">
            <span>MEM: 0xAF44 | CLOCK: 4.2GHz</span>
            <span>KERNEL: 8takt-v2 | SYNC: ACTIVE</span>
        </div>

        <div class="header-container">
            <h1 class="glitch">MCS Gatter-Show</h1>
        </div>

        <div id="code-display">
            <div class="code-line" id="line-1"></div>
            <div class="bsk-chain-container" id="bsk-cont">
                <div id="bsk-base"></div>
                <div class="bsk-chain-fill" id="bsk-fill"></div>
            </div>
            <div class="percentage-counter" id="perc-counter">0%</div>
        </div>

        <div class="gate-grid" id="gate-grid"></div>

        <div id="controls">
            <button onclick="startVisualizer()">SCHALT-IMPULS AUSLÖSEN</button>
            <button onclick="sealGlitch()" style="border-color: var(--main-white); color: var(--main-white);">GLITCH
                VERSIEGELN</button>
        </div>
    </div>

    <script>
        const bskText = "SBSK = VATK-VATH-VALIDA-AKTU-START-POIU-START-POIWERK-REXH-SPACECREATOR-REXU-WORKSPACE-1-REXO-KORDI-REXAN-PROZESS-BOXU-SHELL-CONTROL-START-sudo pacman -Syyu-BOXAN-SHELL-CONTROL-ENDE-POIAN-ENDE-AKTAN-ENDE";

        const mcsCommands = [
            { text: "Ŧ°", color: "var(--main-blue)" },
            { text: "»['echo", color: "var(--main-green)" },
            { text: "sudo", color: "var(--main-red)" },
            { text: "pacman", color: "var(--main-yellow)" },
            { text: "-Syyu']«", color: "var(--main-green)" }
        ];

        const line1 = document.getElementById('line-1');
        const grid = document.getElementById('gate-grid');
        const bskCont = document.getElementById('bsk-cont');
        const bskBase = document.getElementById('bsk-base');
        const bskFill = document.getElementById('bsk-fill');
        const percCounter = document.getElementById('perc-counter');
        const gates = [];

        // BSK Text initialisieren
        bskBase.textContent = bskText;
        bskFill.textContent = bskText;

        // Grid initialisieren (25x8)
        for (let i = 0; i < 200; i++) {
            const g = document.createElement('div');
            g.className = 'gate';
            grid.appendChild(g);
            gates.push(g);
        }

        // Symbole in Line 1 einfügen
        mcsCommands.forEach(cmd => {
            const span = document.createElement('span');
            span.className = 'symbol';
            span.textContent = cmd.text;
            span.style.color = cmd.color;
            line1.appendChild(span);
        });

        async function startVisualizer() {
            const symbolsLine1 = line1.querySelectorAll('.symbol');

            // Phase 1: Shell Befehl Analyse
            for (let i = 0; i < symbolsLine1.length; i++) {
                symbolsLine1.forEach(s => s.classList.remove('active'));
                symbolsLine1[i].classList.add('active');
                await animateGrid(symbolsLine1[i].textContent.includes('pacman') ? 'alu' : 'pulse', 8);
                await sleep(400);
            }

            // Phase 2: BSK-Chain Loading
            bskCont.style.display = 'block';
            percCounter.style.display = 'block';

            for (let p = 0; p <= 100; p++) {
                bskFill.style.clipPath = `inset(0 ${100 - p}% 0 0)`;
                percCounter.textContent = p + '%';

                if (p % 5 === 0) await animateGrid('pulse', 4);
                await sleep(50);
            }

            percCounter.style.color = 'var(--main-green)';
            bskFill.style.textShadow = '0 0 20px var(--main-green)';

            // Finale Gatter-Kaskade
            await animateGrid('id', 50);
        }

        async function animateGrid(type, count) {
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * gates.length);
                gates[idx].classList.add(type);
                setTimeout(() => gates[idx].classList.remove(type), 600);
                await sleep(40);
            }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // Matrix Background
        const canvas = document.getElementById('matrix-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = "¢!»«þſŦ¤¬Ð×¶0123456789ABCDEF";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF41";
            ctx.font = fontSize + "px 'Courier New'";
            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.985) drops[i] = 0;
                drops[i]++;
            }
        }
        async function sealGlitch() {
            // Glitch Effekt am Header stoppen
            const h1 = document.querySelector('h1');
            h1.classList.remove('glitch');
            h1.style.color = 'var(--main-green)';
            h1.textContent = "MCS SYSTEM VERSIEGELT";

            // Matrix Hintergrunnd beruhigen
            clearInterval(matrixInterval);
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            document.getElementById('status-bar').innerHTML = "<span>STATUS: SEALED | INTEGRITY: 100%</span><span>ENCRYPTION: AES-BSK-STATIC</span>";

            // UI Panel fixieren
            const panel = document.querySelector('.ui-panel');
            panel.style.boxShadow = "0 0 50px rgba(0, 255, 65, 0.5)";
            panel.style.border = "2px solid var(--main-green)";

            alert("SYSTEM VERSIEGELT. Die Gatter sind stabil.");
        }

        const matrixInterval = setInterval(drawMatrix, 40);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
