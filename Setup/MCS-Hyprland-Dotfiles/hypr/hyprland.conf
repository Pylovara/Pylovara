# ---------------------------------------------------------
# 💫 Pylovara MCS Kernel Syntax 2.7 → Hyprland PoC Beispiel
# ---------------------------------------------------------
# Dieses Beispiel simuliert eine vollständige hyprland.conf
# durch native MCS Syntax.
# Alle exec/source-Operationen werden über »exec« oder »bind«
# in MCS-Proton-Form ausgeführt.
# ---------------------------------------------------------

¢!
»['exec'|¨$HOME/.config/hypr/initial-boot.sh¨]«
!¢


# ---------------------------------------------------------
# Sourcing external config files
# ---------------------------------------------------------

¢!
»['exec'|¨$HOME/.config/hypr/configs¨]«
»['exec'|¨$HOME/.config/hypr/configs/Keybinds.conf¨]«
!¢


# ---------------------------------------------------------
# User Configuration Area
# ---------------------------------------------------------

¢!
»['exec'|¨$HOME/.config/hypr/UserConfigs¨]«

»['exec'|¨$HOME/.config/hypr/UserConfigs/Startup_Apps.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/ENVariables.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/Laptops.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/LaptopDisplay.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/WindowRules.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/UserDecorations.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/UserAnimations.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/UserKeybinds.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/UserSettings.conf¨]«
»['exec'|¨$HOME/.config/hypr/UserConfigs/01-UserDefaults.conf¨]«
!¢


# ---------------------------------------------------------
# Additional Sources (nwg-displays, workspace)
# ---------------------------------------------------------

¢!
»['exec'|¨$HOME/.config/hypr/monitors.conf¨]«
»['exec'|¨$HOME/.config/hypr/workspaces.conf¨]«
!¢


