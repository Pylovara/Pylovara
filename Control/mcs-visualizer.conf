# mcs-visualizer.conf v0.2 aktiv
# Quelle : /Pylovara/Control/mcs-visualizer.conf
# Zweck: Farbige Darstellung einer MCS-Zeile im Terminal

mcs_highlight() {
    local text="$1"
    # Ansi-Codes (Definition basierend auf der Kitty-Farbzuweisung)
    RED='\e[31m'         # color1: Aktionen »«
    GREEN='\e[32m'       # color2: Proteine []
    YELLOW='\e[33m'      # color3: Trennbefehle |
    PURPLE='\e[35m'      # color5: Transaktionen ¢|/|¢
    DARK_GREEN='\e[92m'  # color10: Protonen {}
    GREY_WHITE='\e[37m'  # color7: CMD '', Pfade
    RESET='\e[0m'

    local highlighted_text="$text"

    # Führt alle Ersetzungen in einem einzigen 'echo | sed' Block aus:
    highlighted_text=$(echo "$highlighted_text" | /Pylovara/System/Shell/Vara/sed.vara -E "

        # 1. Transaktionen (¢| und |¢) - Dunkel Lila
        s/¢\|/${PURPLE}¢\|${RESET}/g;
        s/\|¢/${PURPLE}\|¢${RESET}/g;

        # 2. Aktionen (» und «) - Rot
        s/»/${RED}»${RESET}/g;
        s/«/${RED}«${RESET}/g;

        # 3. Proteine ([ und ]) - Hellgrün
        s/\[/${GREEN}\[${RESET}/g;
        s/\]/${GREEN}\]${RESET}/g;

        # 4. Protonen ({ und }) - Dunkelgrün / Neon
        s/\{/${DARK_GREEN}\{${RESET}/g;
        s/\}/${DARK_GREEN}\}${RESET}/g;

        # 5. CMD ('') - Grau/Weiß
        s/'/${GREY_WHITE}'${RESET}/g;

        # 6. Trennbefehle (|) - Gelb (Muss nach ¢| und |¢ ersetzt werden)
        # HINWEIS: | muss in sed escaped werden, wenn es das Delimiter-Zeichen ist (hier /).
        # Da \| bereits in ¢\|/\|¢ ersetzt wurde, werden nur noch die reinen Trenn-Pipes erfasst.
        s/\|/${YELLOW}\|${RESET}/g;
    ")

    # Ausgabe des farbigen Textes, wobei \e-Sequenzen interpretiert werden.
    echo -e "$highlighted_text"
}

# --- ANWENDUNG (optional) ---
# Um die Funktion einfach zu testen, können Sie einen neuen Alias definieren:
# alias mcs-cat='cat "$@" | while read -r line; do mcs_highlight "$line"; done'
