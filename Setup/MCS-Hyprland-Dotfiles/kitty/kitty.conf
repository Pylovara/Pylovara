# Pylovara MCS Monopol Terminal Konfiguration (v0.1)
# Quelle: /Pylovara/Setup/MCS-Hyprland-Dotfiles/kitty/kitty.conf

# --- SCHRIFTART & GRÖSSE ---
font_family               Fira Code Nerd Font Mono
bold_font                 auto
italic_font               auto
bold_italic_font          auto
font_size                 10.0

# --- FENSTERLAYOUT ---
remember_window_size      yes
initial_window_width      1000
initial_window_height     600
enable_audio_bell         no
confirm_os_window_close   0

# --- HINTERGRUND & TRANSPARENZ ---
background_opacity        0.95
background_blur           10
dynamic_background_opacity yes

# --- MCS FARBSCHEMA DEFINITION ---
# Hinweis: Diese Farben werden von der MCS-Highlighting-Funktion in der Shell verwendet.
# Die Farben 0-7 sind die Standard-ANSI-Farben (z.B. für ls),
# 8-15 sind die helleren Versionen.

# 0. Dunkleres Weiß / Grau (für CMD '')
color7 #d0d0d0

# 1. Rot (für Aktionen »«)
color1 #ff6060

# 2. HellGrün / Neon (für Proteine [])
color2 #38b488

# 3. Gelb (für Trennbefehle |)
color3 #ffff60

# 4. Dunkel Lila (für Transaktion ¢| / |¢)
color5 #6a0dad

# 5. Dunkelgrün / Dunkelneon (für Protonen {})
color10 #107c10

# 6. Weiß mit minimalem Stich Grün (für Pfadangaben */*/ )
color7 #d0f0d0

# Standardfarben
foreground                #d0d0d0
background                #1c1e21
cursor                    #38b488
selection_foreground      #000000
selection_background      #38b488

# Anpassung der MCS-Syntax Farben (Farbcode/Nummerierung folgt dem obigen Schema):
# Aktionen »«: Rot (color1)
# Proteine []: HellGrün (color2)
# Trennbefehle |: Gelb (color3)
# Transaktionen ¢| / |¢: Dunkel Lila (color5)
# Protonen {}: Dunkelgrün (color10, helleres grün in ANSI)
# CMD '': Dunkleres Weiß/Grau (color7)
# Pfadangaben: Weiß-Grün (color7)
