# mcs-visualizer.conf v0.1
# Zweck: Farbige Darstellung einer MCS-Zeile im Terminal

show_mcs_colored() {
    local input="$1"

    local c_reset="\033[0m"
    local c_trans="\033[38;5;208m"   # orange
    local c_protein="\033[38;5;33m"  # blau
    local c_proton="\033[38;5;121m"  # türkis
    local c_reg="\033[38;5;244m"     # grau

    # Transaktionsrahmen hervorheben
    input="${input//¢|/${c_trans}¢|${c_reset}}"
    input="${input//|¢/${c_trans}|¢${c_reset}}"

    # Proteine hervorheben
    input="${input//»[/${c_protein}»[${c_reset}}"
    input="${input//]«/${c_protein}]«${c_reset}}"

    # Protonen hervorheben
    input="${input//\{/${c_proton}\{${c_reset}}"
    input="${input//\}/${c_proton}\}${c_reset}}"

    # Register-Bereich (nur für visuelle Klarheit)
    input="${input//MCS./${c_reg}MCS.${c_reset}}"

    echo -e "$input"
}
