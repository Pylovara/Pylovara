# Pylovara MCS-Hyprland Configuration Core (v0.1)
# Quelle: /Pylovara/Setup/MCS-Hyprland-Dotfiles/hyprland/hyprland.conf

# --- 1. GRUNDLAGEN & VARIABLEN ---
$mainMod = SUPER        # Die MCS-Super-Taste
$terminal = kitty       # Das Monopol-Terminal (term alias)

# --- 2. STARTUP & EXECUTION (Die kritische Sequenz) ---

# [1] Wallpaper Manager starten (Hyprpaper ist nativ)
exec-once = hyprpaper

# [2] Waybar starten (Der MCS-Status Visualizer)
exec-once = waybar

# [3] Das Monopol Terminal (Kitty) für die initiale MCS-Shell starten
# Da der Benutzer die pylovara.wrapper-shell als Login-Shell nutzt,
# wird der MCS-Kontext automatisch geladen.
exec-once = $terminal

# [4] Rofi App Launcher (Wichtig für allgemeine Befehle)
exec-once = sleep 1 && pkill rofi || rofi -show drun &


# --- 3. INPUT CONFIGURATION ---
input {
    kb_layout = de
    follow_mouse = 1
    touchpad { natural_scroll = no }
    sensitivity = 0
}

# --- 4. DECORATIONS & WINDOWS (MCS-Look & Feel) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(38b488) # Pylovara Green
    col.inactive_border = rgb(595959)
    layout = dwindle
}

# --- 5. MCS-KEYBINDS ---

# [1] Launch das Monopol Terminal
bind = $mainMod, RETURN, exec, $terminal

# [2] Launch Rofi App Launcher
bind = $mainMod, SPACE, exec, rofi -show drun

# [3] Relaunch Waybar (Debug-Funktion)
bind = $mainMod, B, exec, killall waybar; waybar

# [4] Kill das aktive Fenster
bind = $mainMod, Q, killactive,

# [5] Exit Hyprland
bind = $mainMod, E, exec, wlogout

# --- 6. WORKSPACES ---
# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
# ... (weitere 4-10)

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
# ... (weitere 4-10)
