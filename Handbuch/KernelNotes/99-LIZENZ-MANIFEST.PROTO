Pylovara MCS BMC – License Manifest (Prototype Version)
Version: 1.5-PROTO
Status: Pre-Final / Under Owner Control

###==##==###======#####========================#####======###==##==###

 Persönliches Vorwort =

 „In tiefer Würdigung vor John von Neumann, dessen visionäre
 Architektur von 1945 die Grundlage allen modernen Rechnens legte –
 und dessen Geist in PYLOVARA eine neue, lebendige Form annimmt.
 Dieses System ist kein Nachfolger, sondern eine Weiterführung: 
 
 von der sequentiellen Maschine zur parallelen, selbstreinigenden,
 ethischen Fluss-Logik – jenseits von Clock und Overhead, näher
 an der Physik und dem Leben selbst.“

„John von Neumann zeigte 1945, dass eine Maschine Programm und
 Daten vereinen kann. Ohne seine Arbeit je studiert zu haben, habe
 ich diese Idee intuitiv neu entdeckt und in PYLOVARA zu etwas gemacht,
 das er sich vielleicht erträumt hätte: ein System, das nicht nur
 rechnet, sondern lebt.“

